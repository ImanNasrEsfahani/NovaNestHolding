name: Frontend production build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    name: Validate Next.js build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.novanestholding.com' }}
      NEXT_PUBLIC_DJANGO_HOST_URL: ${{ vars.NEXT_PUBLIC_DJANGO_HOST_URL || 'http://localhost:8000' }}
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Build production frontend
        run: npm run build

  publish-frontend-platform:
    name: Build and push frontend (${{ matrix.arch }})
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/imannasresfahani/novanestholding-frontend
    steps:
      - name: Validate build-time public URLs
        env:
          FRONTEND_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.novanestholding.com' }}
          API_URL: ${{ vars.NEXT_PUBLIC_DJANGO_HOST_URL }}
        shell: bash
        run: |
          if [[ ! "$FRONTEND_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo '::error::Set NEXT_PUBLIC_SITE_URL to the public HTTPS frontend URL.'
            exit 1
          fi
          if [[ ! "$API_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo '::error::Set repository variable NEXT_PUBLIC_DJANGO_HOST_URL to the actual public HTTPS Django API URL under Settings > Secrets and variables > Actions > Variables.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (native runner, no QEMU)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ImanNasrEsfahani/NovaNestHolding
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=NovaNestHolding Frontend
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.novanestholding.com' }}
            NEXT_PUBLIC_DJANGO_HOST_URL=${{ vars.NEXT_PUBLIC_DJANGO_HOST_URL }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

  publish-frontend:
    name: Publish production Docker image to GHCR
    needs: publish-frontend-platform
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/imannasresfahani/novanestholding-frontend
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Update latest only after BOTH native platform builds succeed.
      # Keep the existing image tags that Docker Compose expects.
      - name: Assemble and publish multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:latest" \
            --tag "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}" \
            "${REGISTRY_IMAGE}:build-${GITHUB_SHA}-amd64" \
            "${REGISTRY_IMAGE}:build-${GITHUB_SHA}-arm64"

      - name: Verify published image contains both architectures
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}")"
          printf '%s\n' "$manifest"
          grep -q 'linux/amd64' <<< "$manifest"
          grep -q 'linux/arm64' <<< "$manifest"
