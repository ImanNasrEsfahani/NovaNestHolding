name: novanest

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-novanest_db}
      MYSQL_USER: ${DB_USER:-novanest_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-database-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-this-root-password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME:-novanest_db}
      DB_USER: ${DB_USER:-novanest_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-database-password}
      DB_HOST: db
      DB_PORT: 3306
      # Microsoft Graph OAuth2 app-only: no SMTP basic credentials.
      MS365_TENANT_ID: ${MS365_TENANT_ID:-}
      MS365_CLIENT_ID: ${MS365_CLIENT_ID:-}
      MS365_CLIENT_SECRET: ${MS365_CLIENT_SECRET:-}
      MS365_SENDER_EMAIL: ${MS365_SENDER_EMAIL:-}
      # Legacy variable name retained only for Startup admin recipient list.
      MAILGUN_ADMIN_RECIPIENTS: ${MAILGUN_ADMIN_RECIPIENTS:-info@novanestventure.com}
      AFFILIATE_APPLICATION_ADMIN_EMAILS: ${AFFILIATE_APPLICATION_ADMIN_EMAILS:-info@novanestholding.com}
      AFFILIATE_REGISTRY_PATH: /app/affiliate-registry/ourTeamAffiliates.json
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_media:/app/media
      - ./frontend/app/i18n/locales/en:/app/affiliate-registry:ro

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/imannasresfahani/novanestholding-frontend:latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_DJANGO_HOST_URL: ${NEXT_PUBLIC_DJANGO_HOST_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data:
    name: ${DB_VOLUME_NAME:-novanest_mysql_data}
  backend_media:
    name: ${MEDIA_VOLUME_NAME:-novanest_backend_media}
